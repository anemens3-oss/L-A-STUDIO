name = "l-a-studio"
main = "worker/index.js"
compatibility_date = "2025-02-01"

# Настройка базы данных Cloudflare D1.
# Если у вас уже создана удалённая база (например, lea-booking-db или lea-studio-db),
# проверьте её название и ID командой: npx wrangler d1 list
# и укажите фактические database_name и database_id ниже перед деплоем.
[[d1_databases]]
binding = "DB"
database_name = "lea-booking-db"
database_id = "48d010c2-6e30-40f5-a5e6-552888f24646"
migrations_dir = "migrations"

# Периодическая повторная отправка отложенных уведомлений в Telegram (каждые 5 минут)
[triggers]
crons = ["*/5 * * * *"]

# ВАЖНО: Никогда не храните секреты в wrangler.toml или в Git!
# Задайте их интерактивно через Cloudflare CLI:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put ADMIN_PASSWORD_SHA256
