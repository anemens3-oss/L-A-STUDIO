name = "l-a-studio"
main = "worker/index.js"
compatibility_date = "2025-02-01"

[build]
command = "npm run build"

# Раздача статических файлов фронтенда (HTML, CSS, JS, изображения из dist/)
[assets]
directory = "./dist"
binding = "ASSETS"

# Настройка базы данных Cloudflare D1.
[[d1_databases]]
binding = "DB"
database_name = "lea-booking-db"
database_id = "48d010c2-6e30-40f5-a5e6-552888f24646"
migrations_dir = "migrations"

# Периодическая повторная отправка отложенных уведомлений в Telegram (каждые 5 минут)
[triggers]
crons = ["*/5 * * * *"]

# ВАЖНО: Никогда не храните секреты в wrangler.toml или в Git!
# Задайте их интерактивно через Cloudflare CLI:
#   npx wrangler secret put ADMIN_LOGIN
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
